<svg xmlns="http://www.w3.org/2000/svg" width="680" height="197" viewBox="0 0 680 197" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" role="img">
<title>A map in three columns, each headed by its icon, lit in turn as one call passes. Your code lights with its system prompt, message list and generation cap. A current runs as text to the server, lit with chaining and prompt caching, then as tokens to the model, lit with its context window and output limit.</title>
<style>@keyframes a-code-color{0%,5.59%{color:#4A5677}7.82%,93.3%{color:#5CC8C0}96.65%,100%{color:#4A5677}}
@keyframes a-system-outline{0%,5.59%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}7.82%,93.3%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}96.65%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-messages-outline{0%,5.59%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}7.82%,93.3%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}96.65%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-cap-outline{0%,5.59%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}7.82%,93.3%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}96.65%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-request-flow-show{0%,5.59%{opacity:0}7.82%,93.3%{opacity:1}96.65%,100%{opacity:0}}
@keyframes a-server-color{0%,20.11%{color:#4A5677}22.35%,93.3%{color:#5CC8C0}96.65%,100%{color:#4A5677}}
@keyframes a-chaining-outline{0%,20.11%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}22.35%,93.3%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}96.65%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-caching-outline{0%,20.11%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}22.35%,93.3%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}96.65%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-tokens-flow-show{0%,20.11%{opacity:0}22.35%,93.3%{opacity:1}96.65%,100%{opacity:0}}
@keyframes a-model-color{0%,34.64%{color:#4A5677}36.87%,93.3%{color:#5CC8C0}96.65%,100%{color:#4A5677}}
@keyframes a-window-outline{0%,34.64%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}36.87%,93.3%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}96.65%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-limit-outline{0%,34.64%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}36.87%,93.3%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}96.65%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
#code>svg{animation:a-code-color 8.95s linear infinite}
#system{animation:a-system-outline 8.95s linear infinite}
#messages{animation:a-messages-outline 8.95s linear infinite}
#cap{animation:a-cap-outline 8.95s linear infinite}
#request-flow{animation:a-request-flow-show 8.95s linear infinite,flow 0.4s linear infinite}
#server>svg{animation:a-server-color 8.95s linear infinite}
#chaining{animation:a-chaining-outline 8.95s linear infinite}
#caching{animation:a-caching-outline 8.95s linear infinite}
#tokens-flow{animation:a-tokens-flow-show 8.95s linear infinite,flow 0.4s linear infinite}
#model>svg{animation:a-model-color 8.95s linear infinite}
#window{animation:a-window-outline 8.95s linear infinite}
#limit{animation:a-limit-outline 8.95s linear infinite}
@keyframes flow{from{stroke-dashoffset:8}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
