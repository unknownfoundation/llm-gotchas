<svg xmlns="http://www.w3.org/2000/svg" width="680" height="106" viewBox="0 0 680 106" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" role="img">
<title>The policy wording fills half a context window, and a bracket marks it the cached part. The history follows, past the window's edge. Sent with default settings, a current runs to the provider API. The whole request turns coral, the part past the edge marked out of context window, and a coral current runs on, refused, to an error.</title>
<style>@keyframes a-wording-fill-level{0%,4.02%{transform:scaleX(0)}14.46%,95.18%{transform:scaleX(1)}97.59%,100%{transform:scaleX(0)}}
@keyframes a-wording-text-show{0%,12.85%{opacity:0}14.46%,95.18%{opacity:1}97.59%,100%{opacity:0}}
@keyframes a-cached-mark-show{0%,18.07%{opacity:0}19.68%,95.18%{opacity:1}97.59%,100%{opacity:0}}
@keyframes a-history-fill-level{0%,28.51%{transform:scaleX(0)}38.96%,95.18%{transform:scaleX(1)}97.59%,100%{transform:scaleX(0)}}
@keyframes a-history-text-show{0%,37.35%{opacity:0}38.96%,95.18%{opacity:1}97.59%,100%{opacity:0}}
@keyframes a-excess-fill-level{0%,38.96%{transform:scaleX(0)}49.4%,95.18%{transform:scaleX(1)}97.59%,100%{transform:scaleX(0)}}
@keyframes a-outside-mark-show{0%,53.01%{opacity:0}54.62%,95.18%{opacity:1}97.59%,100%{opacity:0}}
@keyframes a-send-flow-show{0%,53.01%{opacity:0}54.62%,95.18%{opacity:1}97.59%,100%{opacity:0}}
@keyframes a-refuse-flow-show{0%,53.01%{opacity:0}54.62%,95.18%{opacity:1}97.59%,100%{opacity:0}}
@keyframes a-api-color{0%,53.01%{color:#4A5677}54.62%,95.18%{color:#5CC8C0}97.59%,100%{color:#4A5677}}
@keyframes a-wording-outline{0%,53.01%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}54.62%,95.18%{stroke:#F07F78;stroke-width:1.5px;stroke-dasharray:none}97.59%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-history-outline{0%,53.01%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}54.62%,95.18%{stroke:#F07F78;stroke-width:1.5px;stroke-dasharray:none}97.59%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-excess-outline{0%,53.01%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}54.62%,95.18%{stroke:#F07F78;stroke-width:1.5px;stroke-dasharray:none}97.59%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-refuse-head-fill{0%,53.01%{fill:#E6EAF0}54.62%,95.18%{fill:#F07F78}97.59%,100%{fill:#E6EAF0}}
@keyframes a-error-color{0%,53.01%{color:#4A5677}54.62%,95.18%{color:#F07F78}97.59%,100%{color:#4A5677}}
#wording-fill{transform-box:fill-box;transform-origin:0 50%;animation:a-wording-fill-level 12.45s linear infinite}
#wording-text{animation:a-wording-text-show 12.45s linear infinite}
#cached-mark{animation:a-cached-mark-show 12.45s linear infinite}
#history-fill{transform-box:fill-box;transform-origin:0 50%;animation:a-history-fill-level 12.45s linear infinite}
#history-text{animation:a-history-text-show 12.45s linear infinite}
#excess-fill{transform-box:fill-box;transform-origin:0 50%;animation:a-excess-fill-level 12.45s linear infinite}
#outside-mark{animation:a-outside-mark-show 12.45s linear infinite}
#send-flow{animation:a-send-flow-show 12.45s linear infinite,flow 0.4s linear infinite}
#refuse-flow{animation:a-refuse-flow-show 12.45s linear infinite,flow 0.4s linear infinite}
#api>svg{animation:a-api-color 12.45s linear infinite}
#wording{animation:a-wording-outline 12.45s linear infinite}
#history{animation:a-history-outline 12.45s linear infinite}
#excess{animation:a-excess-outline 12.45s linear infinite}
#refuse-head{animation:a-refuse-head-fill 12.45s linear infinite}
#error>svg{animation:a-error-color 12.45s linear infinite}
@keyframes flow{from{stroke-dashoffset:8}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
