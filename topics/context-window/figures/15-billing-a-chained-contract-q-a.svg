<svg xmlns="http://www.w3.org/2000/svg" width="680" height="106" viewBox="0 0 680 106" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" role="img">
<title>One bar, the third call's input bill. The new question, 500 tokens, the only part your code sent, lands first in teal at the mark. The contract and both earlier exchanges, 3,100 tokens the server reads again, follow and turn coral past it. The bill ends at 3,600 input tokens.</title>
<style>@keyframes a-question-outline{0%,17.39%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}19.57%,93.48%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}96.74%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-question-fill-level{0%,5.43%{transform:scaleX(0)}19.57%,93.48%{transform:scaleX(1)}96.74%,100%{transform:scaleX(0)}}
@keyframes a-question-text-show{0%,17.39%{opacity:0}19.57%,93.48%{opacity:1}96.74%,100%{opacity:0}}
@keyframes a-bill-value-0-show{0%,17.39%{opacity:0}19.57%,36.41%{opacity:1}38.59%,93.48%,96.74%,100%{opacity:0}}
@keyframes a-chain-fill-level{0%,24.46%{transform:scaleX(0)}38.59%,93.48%{transform:scaleX(1)}96.74%,100%{transform:scaleX(0)}}
@keyframes a-chain-text-show{0%,36.41%{opacity:0}38.59%,93.48%{opacity:1}96.74%,100%{opacity:0}}
@keyframes a-bill-value-1-show{0%,36.41%{opacity:0}38.59%,93.48%{opacity:1}96.74%,100%{opacity:0}}
@keyframes a-chain-outline{0%,36.41%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}38.59%,93.48%{stroke:#F07F78;stroke-width:1.5px;stroke-dasharray:none}96.74%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
#question{animation:a-question-outline 9.2s linear infinite}
#question-fill{transform-box:fill-box;transform-origin:0 50%;animation:a-question-fill-level 9.2s linear infinite}
#question-text{animation:a-question-text-show 9.2s linear infinite}
#bill-value-0{animation:a-bill-value-0-show 9.2s linear infinite}
#chain-fill{transform-box:fill-box;transform-origin:0 50%;animation:a-chain-fill-level 9.2s linear infinite}
#chain-text{animation:a-chain-text-show 9.2s linear infinite}
#bill-value-1{animation:a-bill-value-1-show 9.2s linear infinite}
#chain{animation:a-chain-outline 9.2s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="680" height="106" rx="10" fill="#141A2E"/>
<text x="56.79" y="31.5" fill="#E6EAF0">third call</text>
<rect x="56.79" y="42" width="480" height="18" rx="3" fill="none" stroke="#4A5677" stroke-width="1"/>
<g id="question-fill">
<rect id="question" x="57.54" y="42" width="65.17" height="18" rx="3" fill="#1B2442" stroke="#5CC8C0" stroke-width="1.5"/>
</g>
<g id="question-text" opacity="1">
<path d="M58.79 63V68H121.46V63" fill="none" stroke="#E6EAF0" stroke-width="1"/>
<text x="90.13" y="81.5" fill="#E6EAF0" text-anchor="middle">new question: 500</text>
</g>
<g id="chain-fill">
<rect id="chain" x="124.21" y="42" width="411.83" height="18" rx="3" fill="#1B2442" stroke="#F07F78" stroke-width="1.5"/>
</g>
<text id="chain-text" x="330.13" y="53.95" fill="#E6EAF0" text-anchor="middle" opacity="1">contract and both earlier exchanges: 3,100</text>
<path d="M123.46 38V64" fill="none" stroke="#E6EAF0" stroke-width="1"/>
<text x="127.46" y="31.5" fill="#E6EAF0">your code sent</text>
<text id="bill-value-0" x="544.79" y="53.95" fill="#E6EAF0" opacity="0">500 input tokens</text>
<text id="bill-value-1" x="544.79" y="53.95" fill="#E6EAF0" opacity="1">3,600 input tokens</text>
</svg>
