<svg xmlns="http://www.w3.org/2000/svg" width="680" height="106" viewBox="0 0 680 106" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" role="img">
<title>One row, the session: older turns (eleven chapters, reply), a shorter version and recent turns. At compaction the older turns go dashed and the shorter version appears. A bracket marks the shorter version and the recent turns as what the model reads, and a request flows to the model, which turns teal.</title>
<style>@keyframes a-version-block-show{0%,6.58%{opacity:0}9.21%,92.11%{opacity:1}96.05%,100%{opacity:0}}
@keyframes a-old-user-outline{0%,6.58%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}9.21%,92.11%{stroke:#56648A;stroke-width:1px;stroke-dasharray:4 3}96.05%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-old-reply-outline{0%,6.58%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}9.21%,92.11%{stroke:#56648A;stroke-width:1px;stroke-dasharray:4 3}96.05%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-old-user-dim-show{0%,6.58%{opacity:1}9.21%,92.11%{opacity:0.45}96.05%,100%{opacity:1}}
@keyframes a-old-reply-dim-show{0%,6.58%{opacity:1}9.21%,92.11%{opacity:0.45}96.05%,100%{opacity:1}}
@keyframes a-version-outline{0%,23.68%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}26.32%,92.11%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}96.05%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-recent-outline{0%,23.68%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}26.32%,92.11%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}96.05%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-request-bracket-show{0%,23.68%{opacity:0}26.32%,92.11%{opacity:1}96.05%,100%{opacity:0}}
@keyframes a-send-flow-show{0%,23.68%{opacity:0}26.32%,92.11%{opacity:1}96.05%,100%{opacity:0}}
@keyframes a-model-color{0%,23.68%{color:#4A5677}26.32%,92.11%{color:#5CC8C0}96.05%,100%{color:#4A5677}}
#version-block{animation:a-version-block-show 7.6s linear infinite}
#old-user{animation:a-old-user-outline 7.6s linear infinite}
#old-reply{animation:a-old-reply-outline 7.6s linear infinite}
#old-user-dim{animation:a-old-user-dim-show 7.6s linear infinite}
#old-reply-dim{animation:a-old-reply-dim-show 7.6s linear infinite}
#version{animation:a-version-outline 7.6s linear infinite}
#recent{animation:a-recent-outline 7.6s linear infinite}
#request-bracket{animation:a-request-bracket-show 7.6s linear infinite}
#send-flow{animation:a-send-flow-show 7.6s linear infinite,flow 0.4s linear infinite}
#model>svg{animation:a-model-color 7.6s linear infinite}
@keyframes flow{from{stroke-dashoffset:8}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="680" height="106" rx="10" fill="#141A2E"/>
<text x="91.35" y="31.5" fill="#E6EAF0">session</text>
<g id="old-user-dim" opacity="0.45">
<rect id="old-user" x="91.35" y="42" width="83.73" height="18" rx="3" fill="#1B2442" stroke="#56648A" stroke-width="1" stroke-dasharray="4 3"/>
<text x="99.35" y="53.95" fill="#E6EAF0">eleven chapters</text>
</g>
<g id="old-reply-dim" opacity="0.45">
<rect id="old-reply" x="179.08" y="42" width="36.79" height="18" rx="3" fill="#1B2442" stroke="#56648A" stroke-width="1" stroke-dasharray="4 3"/>
<text x="187.08" y="53.95" fill="#E6EAF0">reply</text>
</g>
<g id="version-block" opacity="1">
<rect id="version" x="227.87" y="42" width="79.45" height="18" rx="3" fill="#1B2442" stroke="#5CC8C0" stroke-width="1.5"/>
<text x="235.87" y="53.95" fill="#E6EAF0">shorter version</text>
</g>
<rect id="recent" x="311.32" y="42" width="66.66" height="18" rx="3" fill="#1B2442" stroke="#5CC8C0" stroke-width="1.5"/>
<text x="319.32" y="53.95" fill="#E6EAF0">recent turns</text>
<path d="M93.35 63V68H213.87V63" fill="none" stroke="#E6EAF0" stroke-width="1"/>
