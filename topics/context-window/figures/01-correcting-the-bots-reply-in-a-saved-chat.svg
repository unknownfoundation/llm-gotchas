<polygon id="send-head" points="528.38,47.5 536.38,51 528.38,54.5" fill="#E6EAF0"/>
<g id="model"><svg x="545.71" y="35" width="32" height="32" color="#5CC8C0" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 8.5A8 8 0 0 0 14 9A8.5 8.5 0 0 0 8 17.5A10.5 10.5 0 0 0 8 30.5A8.5 8.5 0 0 0 14 39A8 8 0 0 0 24 39.5A8 8 0 0 0 34 39A8.5 8.5 0 0 0 40 30.5A10.5 10.5 0 0 0 40 17.5A8.5 8.5 0 0 0 34 9A8 8 0 0 0 24 8.5Z" />
<path d="M24 8.5V39.5M24 14.5L18 14.5M24 22L19 22L15.5 25.5M24 32L17.5 32" />
<circle cx="18" cy="14.5" r="2" fill="currentColor" stroke="none" />
<circle cx="15.5" cy="25.5" r="2" fill="currentColor" stroke="none" />
<circle cx="17.5" cy="32" r="2" fill="currentColor" stroke="none" />
</svg></g>
<text x="561.71" y="81.5" fill="#E6EAF0" text-anchor="middle">model</text>
</svg>
