<svg xmlns="http://www.w3.org/2000/svg" width="680" height="118" viewBox="0 0 680 118" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" role="img">
<title>One list of 52 items, its middle items not drawn. A bracket marks the first 2 items, the system prompt and a user message, as not in the request. A second bracket marks the last 50, sent to the model. The first 2 items turn coral at the call.</title>
<style>@keyframes a-first-reply-outline{0%,6.58%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}9.21%,92.11%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}96.05%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-last-reply-outline{0%,6.58%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}9.21%,92.11%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}96.05%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-last-user-outline{0%,6.58%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}9.21%,92.11%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}96.05%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-last-50-bracket-show{0%,6.58%{opacity:0}9.21%,92.11%{opacity:1}96.05%,100%{opacity:0}}
@keyframes a-left-out-bracket-show{0%,23.68%{opacity:0}26.32%,92.11%{opacity:1}96.05%,100%{opacity:0}}
@keyframes a-send-flow-show{0%,23.68%{opacity:0}26.32%,92.11%{opacity:1}96.05%,100%{opacity:0}}
@keyframes a-model-color{0%,23.68%{color:#4A5677}26.32%,92.11%{color:#5CC8C0}96.05%,100%{color:#4A5677}}
@keyframes a-system-outline{0%,23.68%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}26.32%,92.11%{stroke:#F07F78;stroke-width:1.5px;stroke-dasharray:none}96.05%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-first-user-outline{0%,23.68%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}26.32%,92.11%{stroke:#F07F78;stroke-width:1.5px;stroke-dasharray:none}96.05%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
#first-reply{animation:a-first-reply-outline 7.6s linear infinite}
#last-reply{animation:a-last-reply-outline 7.6s linear infinite}
#last-user{animation:a-last-user-outline 7.6s linear infinite}
#last-50-bracket{animation:a-last-50-bracket-show 7.6s linear infinite}
#left-out-bracket{animation:a-left-out-bracket-show 7.6s linear infinite}
#send-flow{animation:a-send-flow-show 7.6s linear infinite,flow 0.4s linear infinite}
#model>svg{animation:a-model-color 7.6s linear infinite}
#system{animation:a-system-outline 7.6s linear infinite}
#first-user{animation:a-first-user-outline 7.6s linear infinite}
@keyframes flow{from{stroke-dashoffset:8}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
