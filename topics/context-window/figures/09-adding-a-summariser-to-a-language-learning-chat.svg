<svg xmlns="http://www.w3.org/2000/svg" width="680" height="106" viewBox="0 0 680 106" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" role="img">
<title>One bar, the input bill, filled call by call. 7 turns cost 7,000, the summary call 2,400, which crosses a mark at 9,200 without a summariser and turns coral, and the next call 500 instead of 2,200. The bill ends at 9,900 input tokens.</title>
<style>@keyframes a-turns-outline{0%,14.61%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}16.44%,94.52%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}97.26%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-turns-fill-level{0%,4.57%{transform:scaleX(0)}16.44%,94.52%{transform:scaleX(1)}97.26%,100%{transform:scaleX(0)}}
@keyframes a-turns-text-show{0%,14.61%{opacity:0}16.44%,94.52%{opacity:1}97.26%,100%{opacity:0}}
@keyframes a-bill-value-0-show{0%,14.61%{opacity:0}16.44%,30.59%{opacity:1}32.42%,94.52%,97.26%,100%{opacity:0}}
@keyframes a-summary-call-fill-level{0%,20.55%{transform:scaleX(0)}32.42%,94.52%{transform:scaleX(1)}97.26%,100%{transform:scaleX(0)}}
@keyframes a-summary-call-text-show{0%,30.59%{opacity:0}32.42%,94.52%{opacity:1}97.26%,100%{opacity:0}}
@keyframes a-bill-value-1-show{0%,30.59%{opacity:0}32.42%,46.58%{opacity:1}48.4%,94.52%,97.26%,100%{opacity:0}}
@keyframes a-summary-call-outline{0%,30.59%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}32.42%,94.52%{stroke:#F07F78;stroke-width:1.5px;stroke-dasharray:none}97.26%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-next-call-outline{0%,46.58%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}48.4%,94.52%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}97.26%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-next-call-fill-level{0%,36.53%{transform:scaleX(0)}48.4%,94.52%{transform:scaleX(1)}97.26%,100%{transform:scaleX(0)}}
@keyframes a-next-call-text-show{0%,46.58%{opacity:0}48.4%,94.52%{opacity:1}97.26%,100%{opacity:0}}
@keyframes a-bill-value-2-show{0%,46.58%{opacity:0}48.4%,94.52%{opacity:1}97.26%,100%{opacity:0}}
#turns{animation:a-turns-outline 10.95s linear infinite}
#turns-fill{transform-box:fill-box;transform-origin:0 50%;animation:a-turns-fill-level 10.95s linear infinite}
#turns-text{animation:a-turns-text-show 10.95s linear infinite}
#bill-value-0{animation:a-bill-value-0-show 10.95s linear infinite}
#summary-call-fill{transform-box:fill-box;transform-origin:0 50%;animation:a-summary-call-fill-level 10.95s linear infinite}
#summary-call-text{animation:a-summary-call-text-show 10.95s linear infinite}
#bill-value-1{animation:a-bill-value-1-show 10.95s linear infinite}
#summary-call{animation:a-summary-call-outline 10.95s linear infinite}
#next-call{animation:a-next-call-outline 10.95s linear infinite}
#next-call-fill{transform-box:fill-box;transform-origin:0 50%;animation:a-next-call-fill-level 10.95s linear infinite}
#next-call-text{animation:a-next-call-text-show 10.95s linear infinite}
#bill-value-2{animation:a-bill-value-2-show 10.95s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="680" height="106" rx="10" fill="#141A2E"/>
<text x="56.79" y="31.5" fill="#E6EAF0">input bill</text>
<rect x="56.79" y="42" width="480" height="18" rx="3" fill="none" stroke="#4A5677" stroke-width="1"/>
<g id="turns-fill">
<rect id="turns" x="57.54" y="42" width="337.89" height="18" rx="3" fill="#1B2442" stroke="#5CC8C0" stroke-width="1.5"/>
</g>
<text id="turns-text" x="226.49" y="53.95" fill="#E6EAF0" text-anchor="middle" opacity="1">7 turns: 7,000</text>
<g id="summary-call-fill">
<rect id="summary-call" x="396.94" y="42" width="114.86" height="18" rx="3" fill="#1B2442" stroke="#F07F78" stroke-width="1.5"/>
</g>
<text id="summary-call-text" x="454.37" y="53.95" fill="#E6EAF0" text-anchor="middle" opacity="1">summary call: 2,400</text>
<g id="next-call-fill">
<rect id="next-call" x="513.3" y="42" width="22.74" height="18" rx="3" fill="#1B2442" stroke="#5CC8C0" stroke-width="1.5"/>
</g>
<g id="next-call-text" opacity="1">
<path d="M514.55 63V68H534.79V63" fill="none" stroke="#E6EAF0" stroke-width="1"/>
<text x="524.67" y="81.5" fill="#E6EAF0" text-anchor="middle">next call: 500 instead of 2,200</text>
</g>
<path d="M502.86 38V64" fill="none" stroke="#E6EAF0" stroke-width="1"/>
<text x="502.86" y="31.5" fill="#E6EAF0" text-anchor="middle">9,200 without a summariser</text>
<text id="bill-value-0" x="544.79" y="53.95" fill="#E6EAF0" opacity="0">7,000 input tokens</text>
<text id="bill-value-1" x="544.79" y="53.95" fill="#E6EAF0" opacity="0">9,400 input tokens</text>
<text id="bill-value-2" x="544.79" y="53.95" fill="#E6EAF0" opacity="1">9,900 input tokens</text>
</svg>
