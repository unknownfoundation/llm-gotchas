<svg xmlns="http://www.w3.org/2000/svg" width="680" height="106" viewBox="0 0 680 106" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" role="img">
<title>At step 6 the first five steps take a third of a context window and go to the provider API. By step 17, steps 6 to 16 have joined them, past the window's edge. The whole request turns coral, the part past the edge marked out of context window, and a coral current runs on, refused, to an error.</title>
<style>@keyframes a-early-outline{0%,14.35%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}16.14%,47.53%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}49.33%,94.62%{stroke:#F07F78;stroke-width:1.5px;stroke-dasharray:none}97.31%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-send-flow-show{0%,14.35%{opacity:0}16.14%,94.62%{opacity:1}97.31%,100%{opacity:0}}
@keyframes a-api-color{0%,14.35%{color:#4A5677}16.14%,94.62%{color:#5CC8C0}97.31%,100%{color:#4A5677}}
@keyframes a-early-fill-level{0%,4.48%{transform:scaleX(0)}16.14%,94.62%{transform:scaleX(1)}97.31%,100%{transform:scaleX(0)}}
@keyframes a-early-text-show{0%,14.35%{opacity:0}16.14%,94.62%{opacity:1}97.31%,100%{opacity:0}}
@keyframes a-later-outline{0%,41.7%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}43.5%,47.53%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}49.33%,94.62%{stroke:#F07F78;stroke-width:1.5px;stroke-dasharray:none}97.31%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-excess-outline{0%,41.7%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}43.5%,47.53%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}49.33%,94.62%{stroke:#F07F78;stroke-width:1.5px;stroke-dasharray:none}97.31%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-later-fill-level{0%,20.18%{transform:scaleX(0)}31.84%,94.62%{transform:scaleX(1)}97.31%,100%{transform:scaleX(0)}}
@keyframes a-later-text-show{0%,30.04%{opacity:0}31.84%,94.62%{opacity:1}97.31%,100%{opacity:0}}
@keyframes a-excess-fill-level{0%,31.84%{transform:scaleX(0)}43.5%,94.62%{transform:scaleX(1)}97.31%,100%{transform:scaleX(0)}}
@keyframes a-outside-mark-show{0%,47.53%{opacity:0}49.33%,94.62%{opacity:1}97.31%,100%{opacity:0}}
@keyframes a-refuse-flow-show{0%,47.53%{opacity:0}49.33%,94.62%{opacity:1}97.31%,100%{opacity:0}}
@keyframes a-refuse-head-fill{0%,47.53%{fill:#E6EAF0}49.33%,94.62%{fill:#F07F78}97.31%,100%{fill:#E6EAF0}}
@keyframes a-error-color{0%,47.53%{color:#4A5677}49.33%,94.62%{color:#F07F78}97.31%,100%{color:#4A5677}}
#early{animation:a-early-outline 11.15s linear infinite}
#send-flow{animation:a-send-flow-show 11.15s linear infinite,flow 0.4s linear infinite}
#api>svg{animation:a-api-color 11.15s linear infinite}
#early-fill{transform-box:fill-box;transform-origin:0 50%;animation:a-early-fill-level 11.15s linear infinite}
#early-text{animation:a-early-text-show 11.15s linear infinite}
#later{animation:a-later-outline 11.15s linear infinite}
#excess{animation:a-excess-outline 11.15s linear infinite}
#later-fill{transform-box:fill-box;transform-origin:0 50%;animation:a-later-fill-level 11.15s linear infinite}
#later-text{animation:a-later-text-show 11.15s linear infinite}
#excess-fill{transform-box:fill-box;transform-origin:0 50%;animation:a-excess-fill-level 11.15s linear infinite}
#outside-mark{animation:a-outside-mark-show 11.15s linear infinite}
#refuse-flow{animation:a-refuse-flow-show 11.15s linear infinite,flow 0.4s linear infinite}
#refuse-head{animation:a-refuse-head-fill 11.15s linear infinite}
#error>svg{animation:a-error-color 11.15s linear infinite}
@keyframes flow{from{stroke-dashoffset:8}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
