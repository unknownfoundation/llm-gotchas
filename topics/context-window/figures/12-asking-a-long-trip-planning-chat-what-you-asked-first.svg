<text x="108.6" y="245.94" fill="#E6EAF0">"... tonight ..."</text>
<g fill="#E6EAF0"><circle cx="206.14" cy="262" r="1.2"/><circle cx="206.14" cy="267" r="1.2"/><circle cx="206.14" cy="272" r="1.2"/></g>
