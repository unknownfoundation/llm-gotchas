<svg xmlns="http://www.w3.org/2000/svg" width="680" height="346" viewBox="0 0 680 346" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" role="img">
<title>A store of chat turns: the flights request at the top, older turns, the last six messages and the new message. Each older turn is scored from the top down. The five that share a word with the new message light as the top five, the flights request, score 0, turns coral, and a request goes to the model.</title>
<style>@keyframes a-flights-outline{0%,4.63%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}6.48%,8.8%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}10.65%,33.8%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}35.65%,94.44%{stroke:#F07F78;stroke-width:1.5px;stroke-dasharray:none}97.22%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-pick-a-outline{0%,8.8%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}10.65%,12.96%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}14.81%,33.8%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}35.65%,94.44%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}97.22%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-pick-b-outline{0%,12.96%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}14.81%,17.13%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}18.98%,33.8%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}35.65%,94.44%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}97.22%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-pick-c-outline{0%,17.13%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}18.98%,21.3%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}23.15%,33.8%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}35.65%,94.44%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}97.22%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-pick-d-outline{0%,21.3%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}23.15%,25.46%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}27.31%,33.8%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}35.65%,94.44%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}97.22%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-pick-e-outline{0%,25.46%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}27.31%,29.63%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}31.48%,33.8%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}35.65%,94.44%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}97.22%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-added-back-bracket-show{0%,33.8%{opacity:0}35.65%,94.44%{opacity:1}97.22%,100%{opacity:0}}
@keyframes a-left-out-bracket-show{0%,33.8%{opacity:0}35.65%,94.44%{opacity:1}97.22%,100%{opacity:0}}
@keyframes a-last-six-outline{0%,45.83%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}47.69%,94.44%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}97.22%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-new-outline{0%,45.83%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}47.69%,94.44%{stroke:#5CC8C0;stroke-width:1.5px;stroke-dasharray:none}97.22%,100%{stroke:#4A5677;stroke-width:1px;stroke-dasharray:none}}
@keyframes a-send-flow-show{0%,45.83%{opacity:0}47.69%,94.44%{opacity:1}97.22%,100%{opacity:0}}
@keyframes a-model-color{0%,45.83%{color:#4A5677}47.69%,94.44%{color:#5CC8C0}97.22%,100%{color:#4A5677}}
#flights{animation:a-flights-outline 10.8s linear infinite}
#pick-a{animation:a-pick-a-outline 10.8s linear infinite}
#pick-b{animation:a-pick-b-outline 10.8s linear infinite}
#pick-c{animation:a-pick-c-outline 10.8s linear infinite}
#pick-d{animation:a-pick-d-outline 10.8s linear infinite}
#pick-e{animation:a-pick-e-outline 10.8s linear infinite}
#added-back-bracket{animation:a-added-back-bracket-show 10.8s linear infinite}
#left-out-bracket{animation:a-left-out-bracket-show 10.8s linear infinite}
#last-six{animation:a-last-six-outline 10.8s linear infinite}
#new{animation:a-new-outline 10.8s linear infinite}
#send-flow{animation:a-send-flow-show 10.8s linear infinite,flow 0.4s linear infinite}
#model>svg{animation:a-model-color 10.8s linear infinite}
@keyframes flow{from{stroke-dashoffset:8}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
