<svg xmlns="http://www.w3.org/2000/svg" width="680" height="154" viewBox="0 0 680 154" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="9.5" role="img">
<title>Four handbook parts in a column, an arrow to the model, an arrow on to the lists. Call by call, one part lights alone, a current runs along both arrows, and its list of warnings with pages appears and stays lit. At the end a bracket marks the four lists as the merged list.</title>
